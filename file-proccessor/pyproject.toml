[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "somnus-file-processor"
version = "2.0.0"
description = "Enterprise-grade file processing with semantic chunking and universal format support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SOMNUS Team", email = "dev@somnus.ai"}
]
keywords = [
    "file-processing",
    "semantic-chunking",
    "nlp",
    "document-processing",
    "text-extraction",
    "enterprise"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Core dependencies (required)
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0,<2.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "nltk>=3.8.0,<4.0.0",
    "networkx>=3.0,<4.0.0",
    "Pillow>=10.0.0,<11.0.0",
    "aiofiles>=23.0.0,<24.0.0",
    "ratelimit>=2.2.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
# Recommended for best performance
recommended = [
    "sentence-transformers>=2.2.0,<3.0.0",
    "spacy>=3.6.0,<4.0.0",
]

# Full feature set
full = [
    "sentence-transformers>=2.2.0,<3.0.0",
    "spacy>=3.6.0,<4.0.0",
    "opencv-python>=4.8.0,<5.0.0",
    "librosa>=0.10.0,<1.0.0",
    "ffmpeg-python>=0.2.0,<1.0.0",
    "ezdxf>=1.1.0,<2.0.0",
    "trimesh>=4.0.0,<5.0.0",
    "h5py>=3.9.0,<4.0.0",
    "pydicom>=2.4.0,<3.0.0",
    "psd-tools>=1.9.0,<2.0.0",
    "hl7apy>=1.3.0,<2.0.0",
    "fhir.resources>=7.0.0,<8.0.0",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[project.urls]
Homepage = "https://github.com/somnus-ai/file-processor"
Documentation = "https://docs.somnus.ai/file-processor"
Repository = "https://github.com/somnus-ai/file-processor"
Issues = "https://github.com/somnus-ai/file-processor/issues"

[project.scripts]
somnus-process = "somnus_file_processor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["somnus_file_processor*"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.pyi"]

# ============================================
# TOOL CONFIGURATIONS
# ============================================

[tool.ruff]
target-version = "py310"
line-length = 120
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "ARG001", # unused function argument
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001", "S101"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "nltk.*",
    "scipy.*",
    "sklearn.*",
    "networkx.*",
    "PIL.*",
    "sentence_transformers.*",
    "spacy.*",
    "cv2.*",
    "librosa.*",
    "ezdxf.*",
    "trimesh.*",
    "h5py.*",
    "pydicom.*",
    "psd_tools.*",
    "hl7apy.*",
    "fhir.*",
    "aiofiles.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["somnus_file_processor"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 80

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["somnus_file_processor"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
